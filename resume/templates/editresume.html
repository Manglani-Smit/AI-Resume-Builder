<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<title>Edit Resume</title>

</head>

<body class="bg-light">

{% if messages %}
{% for message in messages %}
<script>alert("{{message}}")</script>
{% endfor %}
{% endif %}

{% include 'nav.html' %}

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow">

<div class="card-header bg-warning">

<h3 class="text-center mb-0">

<i class="bi bi-pencil-square"></i>

Edit Resume

</h3>

</div>

<div class="card-body">

<form method="POST" action="/fetcheditresumedata/{{resume.id}}">

{% csrf_token %}

<div class="mb-3">

<label class="form-label">

Full Name

</label>

<input
type="text"
class="form-control"
name="name"
value="{{resume.name}}">

</div>

<div class="mb-3">

<label class="form-label">

Email

</label>

<input
type="email"
class="form-control"
name="email"
value="{{resume.email}}">

</div>

<div class="mb-3">

<label class="form-label">

Phone

</label>

<input
type="text"
class="form-control"
name="phone"
value="{{resume.phone}}">

</div>

<div class="mb-3">

<label class="form-label">

Skills

</label>

<input
type="text"
class="form-control"
name="skills"
value="{{resume.skills}}">

<small class="text-muted">

Example: Python, Django, MySQL

</small>

</div>

<div class="mb-3">

<label class="form-label">

Education

</label>

<input
type="text"
class="form-control"
name="education"
value="{{resume.education}}">

</div>

<div class="d-grid">

<button
type="submit"
class="btn btn-warning btn-lg">

<i class="bi bi-check-circle-fill"></i>

Update Resume

</button>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

</body>

</html>
