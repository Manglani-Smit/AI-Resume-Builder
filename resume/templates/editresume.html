{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Resume - AI Resume Builder</title>

    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        .edit-card {
            border-radius: 20px;
        }
        .card-header-custom {
            background: linear-gradient(135deg, #ffc107 0%, #ff9800 100%);
            border-top-left-radius: 20px !important;
            border-top-right-radius: 20px !important;
        }
    </style>
</head>

<body class="bg-light">

{% if messages %}
    {% for message in messages %}
        <script>alert("{{ message }}");</script>
    {% endfor %}
{% endif %}

{% include 'nav.html' %}

<div class="container my-5 py-2">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">

            <div class="card border-0 shadow-lg edit-card bg-white">
                <!-- Card Header -->
                <div class="card-header-custom text-dark p-4 text-center">
                    <h3 class="fw-bold mb-1">
                        <i class="bi bi-pencil-square me-2"></i> Edit Resume Details
                    </h3>
                    <p class="mb-0 text-dark opacity-75 small">Update your candidate information below</p>
                </div>

                <!-- Form Body -->
                <div class="card-body p-4 p-md-5">
                    <form method="POST" action="/fetcheditresumedata/{{ resume.id }}">
                        {% csrf_token %}

                        <!-- Full Name -->
                        <div class="mb-3">
                            <label class="form-label fw-bold text-dark">Full Name 👤</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                                <input type="text" class="form-control border-start-0 bg-light" name="name" value="{{ resume.name }}" required>
                            </div>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label fw-bold text-dark">Email Address 📧</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                                <input type="email" class="form-control border-start-0 bg-light" name="email" value="{{ resume.email }}" required>
                            </div>
                        </div>

                        <!-- Phone -->
                        <div class="mb-3">
                            <label class="form-label fw-bold text-dark">Phone Number 📱</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-telephone text-muted"></i></span>
                                <input type="text" class="form-control border-start-0 bg-light" name="phone" value="{{ resume.phone }}" required>
                            </div>
                        </div>

                        <!-- Skills -->
                        <div class="mb-3">
                            <label class="form-label fw-bold text-dark">Key Skills ⚡</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-tools text-muted"></i></span>
                                <input type="text" class="form-control border-start-0 bg-light" name="skills" value="{{ resume.skills }}" required>
                            </div>
                            <small class="text-muted">Separate skills with commas (e.g. Python, Django, MySQL)</small>
                        </div>

                        <!-- Education -->
                        <div class="mb-4">
                            <label class="form-label fw-bold text-dark">Education 🎓</label>
                            <textarea class="form-control bg-light" name="education" rows="3" required>{{ resume.education }}</textarea>
                        </div>

                        <!-- Action Buttons -->
                        <div class="d-flex gap-3">
                            <a href="/resumelist" class="btn btn-outline-secondary btn-lg rounded-pill px-4 fw-semibold flex-fill">
                                Cancel
                            </a>
                            <button type="submit" class="btn btn-warning btn-lg rounded-pill px-5 fw-bold text-dark flex-fill shadow-sm">
                                <i class="bi bi-check-circle-fill me-1"></i> Update Resume
                            </button>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.bundle.min.css"></script>
</body>
</html>
