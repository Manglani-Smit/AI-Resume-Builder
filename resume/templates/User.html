<!DOCTYPE html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>AI Resume Builder</title>
</head>

<body>
{% if messages %}
{% for message in messages %}
<script>alert("{{message}}")</script>
{% endfor %}
{% endif %}

{% include 'nav.html' %}

<div class="container mt-3">
    <div class="row">
        <div class="col-md-4">
            <div class="card shadow-lg rounded-4">
                <div class="card-body p-4">
                    <h1>🚀</h1>
                    <h2>Create Your Perfect Resume</h2>
                    <p>
                        Build ATS Friendly Resume
                        using AI Assistance.
                    </p>
                    <ul>
                        <li>AI Suggestions</li>
                        <li>Professional Templates</li>
                        <li>ATS Optimized</li>
                    </ul>
                    <button class="btn btn-dark">Let's Get Started</button>
                </div>
            </div>
        </div>
        <div class="col-md-8">
            <label class="fw-bold">Register Now!</label><br>
            <div class="mt-4">
                <div class="card shadow-lg rounded-4">
                    <div class="card-body">
                        <form method="POST" action="/fetchuserdata">

                            {% csrf_token %}

                            <label class="fw-bold">Name 👤</label>
                            <br>
                            <input type="text" name="name" class="form-control" placeholder="Enter Your Name">
                            <br><br>

                            <label class="fw-bold">Email 📧</label>
                            <br>
                            <input type="email" name="email" class="form-control" placeholder="Enter Your Email">
                            <br><br>

                            <label class="fw-bold">Phone 📱</label>
                            <br>
                            <input type="text" name="phone" class="form-control" placeholder="Enter Your Phone">
                            <br><br>

                            <label class="fw-bold">Password 🔒</label>
                            <br>
                            <input type="password" id="password" name="password" class="form-control" placeholder="Enter Your Password">
                            <br><br>

                            <!-- नया Confirm Password फ़ील्ड यहाँ जोड़ा गया है -->
                            <label class="fw-bold">Confirm Password 🔒</label>
                            <br>
                            <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Confirm Your Password">
                            <br><br>

                            <button class="btn btn-primary w-100">
                                Register Now
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
